services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: aos-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aos_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aos_net

  livekit:
    image: livekit/livekit-server:v1.9.12
    container_name: aos-livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50010}:${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50010}/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7880"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aos_net

  translation:
    build:
      context: ./infra/translation
      dockerfile: Dockerfile
    container_name: aos-translation
    restart: unless-stopped
    environment:
      TRANSLATION_MODEL_PATH: /models/nllb
      TRANSLATION_MODEL_NAME: ${TRANSLATION_MODEL_NAME:-nllb-200-distilled-1.3B-ct2-int8}
      TRANSLATION_DEVICE: ${TRANSLATION_DEVICE:-cpu}
      TRANSLATION_COMPUTE_TYPE: ${TRANSLATION_COMPUTE_TYPE:-int8}
      TRANSLATION_DEFAULT_SOURCE_LANGUAGE: ${TRANSLATION_DEFAULT_SOURCE_LANGUAGE:-eng_Latn}
      TRANSLATION_MAX_CHARS: ${TRANSLATION_MAX_CHARS:-1000}
    ports:
      - "${TRANSLATION_PORT:-8100}:8000"
    volumes:
      - ${TRANSLATION_MODEL_HOST_PATH:-./models/nllb-200-distilled-1.3B-ct2-int8}:/models/nllb:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - aos_net

volumes:
  qdrant_data:
  minio_data:

networks:
  aos_net:
    driver: bridge
