name: aos

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

services:
  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    container_name: aos-qdrant
    restart: unless-stopped

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}

    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\napi-key: %s\r\nConnection: close\r\n\r\n' "$${QDRANT__SERVICE__API_KEY}" >&3 && grep -q '200 OK' <&3
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    mem_limit: "${QDRANT_MEMORY_LIMIT:-1536m}"
    cpus: "${QDRANT_CPU_LIMIT:-1.50}"
    pids_limit: "${QDRANT_PIDS_LIMIT:-512}"

    stop_grace_period: 30s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: aos-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Second-line cleanup for multipart uploads if an app cleanup request is
      # interrupted. AOS sessions expire at the application layer as well, but
      # object storage must independently reclaim abandoned part data.
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-1h}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:?MINIO_API_CORS_ALLOW_ORIGIN is required}

    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9101}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    mem_limit: "${MINIO_MEMORY_LIMIT:-1g}"
    cpus: "${MINIO_CPU_LIMIT:-1.00}"
    pids_limit: "${MINIO_PIDS_LIMIT:-512}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  video-redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    container_name: aos-video-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VIDEO_REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction

    volumes:
      - video_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    mem_limit: "${VIDEO_REDIS_MEMORY_LIMIT:-768m}"
    cpus: "${VIDEO_REDIS_CPU_LIMIT:-0.50}"
    pids_limit: "${VIDEO_REDIS_PIDS_LIMIT:-256}"

    stop_grace_period: 30s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net


