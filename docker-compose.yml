name: aos

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: aos-qdrant
    restart: unless-stopped

    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    mem_limit: "${QDRANT_MEMORY_LIMIT:-1536m}"
    cpus: "${QDRANT_CPU_LIMIT:-1.50}"
    pids_limit: "${QDRANT_PIDS_LIMIT:-512}"

    stop_grace_period: 30s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aos-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9101}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    mem_limit: "${MINIO_MEMORY_LIMIT:-1g}"
    cpus: "${MINIO_CPU_LIMIT:-1.00}"
    pids_limit: "${MINIO_PIDS_LIMIT:-512}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  video-redis:
    image: redis:7.4-alpine
    container_name: aos-video-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VIDEO_REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction

    volumes:
      - video_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    mem_limit: "${VIDEO_REDIS_MEMORY_LIMIT:-768m}"
    cpus: "${VIDEO_REDIS_CPU_LIMIT:-0.50}"
    pids_limit: "${VIDEO_REDIS_PIDS_LIMIT:-256}"

    stop_grace_period: 30s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  livekit:
    image: livekit/livekit-server:v1.9.12
    container_name: aos-livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit/livekit.yaml

    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?LIVEKIT_KEYS is required}

    ports:
      # Signaling is private and proxied by Nginx.
      - "${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_PORT:-7880}:7880"

      # RTC TCP fallback is accessed directly.
      - "${LIVEKIT_TCP_BIND_ADDRESS:-0.0.0.0}:${LIVEKIT_TCP_PORT:-7881}:7881/tcp"

      # WebRTC UDP media range is accessed directly.
      - "${LIVEKIT_UDP_BIND_ADDRESS:-0.0.0.0}:${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50010}:${LIVEKIT_UDP_PORT_START:-50000}-${LIVEKIT_UDP_PORT_END:-50010}/udp"

    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7880"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    mem_limit: "${LIVEKIT_MEMORY_LIMIT:-1536m}"
    cpus: "${LIVEKIT_CPU_LIMIT:-2.00}"
    pids_limit: "${LIVEKIT_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  translation:
    build:
      context: ./infra/translation
      dockerfile: Dockerfile

    container_name: aos-translation
    restart: unless-stopped

    environment:
      TRANSLATION_MODEL_PATH: /models/nllb
      TRANSLATION_MODEL_NAME: ${TRANSLATION_MODEL_NAME:-nllb-200-distilled-1.3B-ct2-int8}
      TRANSLATION_DEVICE: ${TRANSLATION_DEVICE:-cpu}
      TRANSLATION_COMPUTE_TYPE: ${TRANSLATION_COMPUTE_TYPE:-int8}
      TRANSLATION_DEFAULT_SOURCE_LANGUAGE: ${TRANSLATION_DEFAULT_SOURCE_LANGUAGE:-eng_Latn}
      TRANSLATION_MAX_CHARS: ${TRANSLATION_MAX_CHARS:-1000}

    ports:
      - "${TRANSLATION_BIND_ADDRESS:-127.0.0.1}:${TRANSLATION_PORT:-8100}:8000"

    volumes:
      - "${TRANSLATION_MODEL_HOST_PATH:-./models/nllb-200-distilled-1.3B-ct2-int8}:/models/nllb:ro"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    mem_limit: "${TRANSLATION_MEMORY_LIMIT:-4g}"
    cpus: "${TRANSLATION_CPU_LIMIT:-3.00}"
    pids_limit: "${TRANSLATION_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  image-search:
    build:
      context: ./infra/image-search
      dockerfile: Dockerfile

    container_name: aos-image-search
    restart: unless-stopped

    environment:
      IMAGE_SEARCH_SERVICE_NAME: ${IMAGE_SEARCH_SERVICE_NAME:-aos-image-search}
      IMAGE_SEARCH_ENVIRONMENT: ${IMAGE_SEARCH_ENVIRONMENT:-development}
      IMAGE_SEARCH_DEBUG: ${IMAGE_SEARCH_DEBUG:-false}
      IMAGE_SEARCH_MODEL_NAME: ${IMAGE_SEARCH_MODEL_NAME:-ViT-B-32}
      IMAGE_SEARCH_PRETRAINED: ${IMAGE_SEARCH_PRETRAINED:-laion2b_s34b_b79k}
      IMAGE_SEARCH_DEVICE: ${IMAGE_SEARCH_DEVICE:-cpu}
      IMAGE_SEARCH_VECTOR_SIZE: ${IMAGE_SEARCH_VECTOR_SIZE:-512}
      IMAGE_SEARCH_QDRANT_URL: ${IMAGE_SEARCH_QDRANT_URL:-http://qdrant:6333}
      IMAGE_SEARCH_QDRANT_API_KEY: ${IMAGE_SEARCH_QDRANT_API_KEY:-}
      IMAGE_SEARCH_COLLECTION: ${IMAGE_SEARCH_COLLECTION:-ads}
      IMAGE_SEARCH_LIMIT: ${IMAGE_SEARCH_LIMIT:-50}
      IMAGE_SEARCH_MAX_LIMIT: ${IMAGE_SEARCH_MAX_LIMIT:-100}
      IMAGE_SEARCH_SCORE_THRESHOLD: ${IMAGE_SEARCH_SCORE_THRESHOLD:-0.75}
      IMAGE_SEARCH_PRIMARY_BOOST: ${IMAGE_SEARCH_PRIMARY_BOOST:-0.02}
      IMAGE_SEARCH_MAX_IMAGE_BYTES: ${IMAGE_SEARCH_MAX_IMAGE_BYTES:-10485760}
      IMAGE_SEARCH_REQUEST_TIMEOUT_SECONDS: ${IMAGE_SEARCH_REQUEST_TIMEOUT_SECONDS:-15}
      IMAGE_SEARCH_FILE_BASE_URL: ${IMAGE_SEARCH_FILE_BASE_URL:-}

    ports:
      - "${IMAGE_SEARCH_BIND_ADDRESS:-127.0.0.1}:${IMAGE_SEARCH_PORT:-8110}:8000"

    depends_on:
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    mem_limit: "${IMAGE_SEARCH_MEMORY_LIMIT:-4g}"
    cpus: "${IMAGE_SEARCH_CPU_LIMIT:-3.00}"
    pids_limit: "${IMAGE_SEARCH_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  background-removal:
    build:
      context: ./infra/background-removal
      dockerfile: Dockerfile

    container_name: aos-background-removal
    restart: unless-stopped

    environment:
      BACKGROUND_REMOVAL_SERVICE_NAME: ${BACKGROUND_REMOVAL_SERVICE_NAME:-aos-background-removal}
      BACKGROUND_REMOVAL_ENVIRONMENT: ${BACKGROUND_REMOVAL_ENVIRONMENT:-development}
      BACKGROUND_REMOVAL_DEBUG: ${BACKGROUND_REMOVAL_DEBUG:-false}
      BACKGROUND_REMOVAL_MODEL_NAME: ${BACKGROUND_REMOVAL_MODEL_NAME:-u2net}
      BACKGROUND_REMOVAL_DEVICE: ${BACKGROUND_REMOVAL_DEVICE:-cpu}
      BACKGROUND_REMOVAL_MODEL_PATH: ${BACKGROUND_REMOVAL_MODEL_PATH:-}
      BACKGROUND_REMOVAL_MAX_IMAGE_BYTES: ${BACKGROUND_REMOVAL_MAX_IMAGE_BYTES:-10485760}
      BACKGROUND_REMOVAL_REQUEST_TIMEOUT_SECONDS: ${BACKGROUND_REMOVAL_REQUEST_TIMEOUT_SECONDS:-30}
      BACKGROUND_REMOVAL_OUTPUT_FORMAT: ${BACKGROUND_REMOVAL_OUTPUT_FORMAT:-png}

    ports:
      - "${BACKGROUND_REMOVAL_BIND_ADDRESS:-127.0.0.1}:${BACKGROUND_REMOVAL_PORT:-8120}:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    mem_limit: "${BACKGROUND_REMOVAL_MEMORY_LIMIT:-3g}"
    cpus: "${BACKGROUND_REMOVAL_CPU_LIMIT:-2.00}"
    pids_limit: "${BACKGROUND_REMOVAL_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  video-api:
    build:
      context: ./infra/video-processing
      dockerfile: Dockerfile

    container_name: aos-video-api
    restart: unless-stopped

    environment:
      VIDEO_SERVICE_NAME: ${VIDEO_SERVICE_NAME:-aos-video-processing}
      VIDEO_SERVICE_ENVIRONMENT: ${VIDEO_SERVICE_ENVIRONMENT:-development}
      VIDEO_SERVICE_DEBUG: ${VIDEO_SERVICE_DEBUG:-false}
      VIDEO_SERVICE_SECRET: ${VIDEO_SERVICE_SECRET:?VIDEO_SERVICE_SECRET is required}
      VIDEO_SERVICE_CALLBACK_SECRET: ${VIDEO_SERVICE_CALLBACK_SECRET:?VIDEO_SERVICE_CALLBACK_SECRET is required}
      VIDEO_REDIS_URL: ${VIDEO_REDIS_URL:-redis://video-redis:6379/0}
      VIDEO_QUEUE_NAME: ${VIDEO_QUEUE_NAME:-video}
      VIDEO_JOB_TIMEOUT_SECONDS: ${VIDEO_JOB_TIMEOUT_SECONDS:-1800}
      VIDEO_RESULT_TTL_SECONDS: ${VIDEO_RESULT_TTL_SECONDS:-86400}
      VIDEO_FAILURE_TTL_SECONDS: ${VIDEO_FAILURE_TTL_SECONDS:-604800}
      VIDEO_MAX_DURATION_SECONDS: ${VIDEO_MAX_DURATION_SECONDS:-180}

      MINIO_ENDPOINT: ${VIDEO_MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: ${VIDEO_MINIO_SECURE:-false}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:?MINIO_PUBLIC_BASE_URL is required}

      VIDEO_LEGACY_OUTPUT_BUCKET: ${AOS_MINIO_BUCKET:-shorts}
      VIDEO_LEGACY_OUTPUT_BASE_PATH: ${VIDEO_LEGACY_OUTPUT_BASE_PATH:-shorts/processed}
      VIDEO_THUMBNAIL_BUCKET: ${AOS_PUBLIC_BUCKET:-aos-public}
      VIDEO_THUMBNAIL_BASE_PATH: ${VIDEO_THUMBNAIL_BASE_PATH:-shorts/thumbnails}

    ports:
      - "${VIDEO_SERVICE_BIND_ADDRESS:-127.0.0.1}:${VIDEO_SERVICE_PORT:-8130}:8000"

    depends_on:
      minio:
        condition: service_healthy
      video-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    mem_limit: "${VIDEO_API_MEMORY_LIMIT:-512m}"
    cpus: "${VIDEO_API_CPU_LIMIT:-1.00}"
    pids_limit: "${VIDEO_API_PIDS_LIMIT:-512}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  video-worker:
    build:
      context: ./infra/video-processing
      dockerfile: Dockerfile

    container_name: aos-video-worker
    restart: unless-stopped

    command: ["rq", "worker", "${VIDEO_QUEUE_NAME:-video}", "--url", "${VIDEO_REDIS_URL:-redis://video-redis:6379/0}"]

    environment:
      VIDEO_SERVICE_NAME: ${VIDEO_SERVICE_NAME:-aos-video-processing}
      VIDEO_SERVICE_ENVIRONMENT: ${VIDEO_SERVICE_ENVIRONMENT:-development}
      VIDEO_SERVICE_DEBUG: ${VIDEO_SERVICE_DEBUG:-false}
      VIDEO_SERVICE_CALLBACK_SECRET: ${VIDEO_SERVICE_CALLBACK_SECRET:?VIDEO_SERVICE_CALLBACK_SECRET is required}
      VIDEO_REDIS_URL: ${VIDEO_REDIS_URL:-redis://video-redis:6379/0}
      VIDEO_QUEUE_NAME: ${VIDEO_QUEUE_NAME:-video}
      VIDEO_JOB_TIMEOUT_SECONDS: ${VIDEO_JOB_TIMEOUT_SECONDS:-1800}
      VIDEO_RESULT_TTL_SECONDS: ${VIDEO_RESULT_TTL_SECONDS:-86400}
      VIDEO_FAILURE_TTL_SECONDS: ${VIDEO_FAILURE_TTL_SECONDS:-604800}
      VIDEO_MAX_DURATION_SECONDS: ${VIDEO_MAX_DURATION_SECONDS:-180}

      MINIO_ENDPOINT: ${VIDEO_MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: ${VIDEO_MINIO_SECURE:-false}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:?MINIO_PUBLIC_BASE_URL is required}

      VIDEO_LEGACY_OUTPUT_BUCKET: ${AOS_MINIO_BUCKET:-shorts}
      VIDEO_LEGACY_OUTPUT_BASE_PATH: ${VIDEO_LEGACY_OUTPUT_BASE_PATH:-shorts/processed}
      VIDEO_THUMBNAIL_BUCKET: ${AOS_PUBLIC_BUCKET:-aos-public}
      VIDEO_THUMBNAIL_BASE_PATH: ${VIDEO_THUMBNAIL_BASE_PATH:-shorts/thumbnails}

    depends_on:
      minio:
        condition: service_healthy
      video-redis:
        condition: service_healthy

    mem_limit: "${VIDEO_WORKER_MEMORY_LIMIT:-3g}"
    cpus: "${VIDEO_WORKER_CPU_LIMIT:-2.00}"
    pids_limit: "${VIDEO_WORKER_PIDS_LIMIT:-1024}"

    stop_grace_period: 5m
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  tileserver:
    image: ${TILESERVER_IMAGE:?TILESERVER_IMAGE is required}
    container_name: aos-tileserver
    restart: unless-stopped

    command:
      - --config
      - /data/config.json
      - --public_url
      - ${TILESERVER_PUBLIC_URL:?TILESERVER_PUBLIC_URL is required}

    environment:
      TILESERVER_GL_ALLOWED_HOSTS: ${TILESERVER_ALLOWED_HOSTS:?TILESERVER_ALLOWED_HOSTS is required}

    ports:
      - "${TILESERVER_BIND_ADDRESS:-127.0.0.1}:${TILESERVER_PORT:-8080}:8080"

    volumes:
      - ./infra/maps/tileserver/config.json:/data/config.json:ro
      - ./infra/maps/tileserver/styles:/data/styles:ro
      - ./infra/maps/tileserver/fonts:/data/fonts:ro
      - ./maps/tiles:/data/data:ro

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/styles/aos/style.json').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

    mem_limit: "${TILESERVER_MEMORY_LIMIT:-1536m}"
    cpus: "${TILESERVER_CPU_LIMIT:-2.00}"
    pids_limit: "${TILESERVER_PIDS_LIMIT:-512}"

    stop_grace_period: 30s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  nominatim:
    image: mediagis/nominatim:5.3
    container_name: aos-nominatim
    restart: unless-stopped

    environment:
      PBF_PATH: /data/kenya.osm.pbf
      REPLICATION_URL: ""
      UPDATE_MODE: none
      REVERSE_ONLY: "false"

      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?NOMINATIM_PASSWORD is required}
      IMPORT_STYLE: full

      THREADS: ${NOMINATIM_THREADS:-2}
      GUNICORN_WORKERS: ${NOMINATIM_WORKERS:-1}

    ports:
      - "${NOMINATIM_BIND_ADDRESS:-127.0.0.1}:${NOMINATIM_PORT:-8081}:8080"

    volumes:
      - ./maps/kenya/kenya.osm.pbf:/data/kenya.osm.pbf:ro
      - nominatim_data:/var/lib/postgresql/16/main

    shm_size: "${NOMINATIM_SHM_SIZE:-1gb}"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/status?format=json"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 5m

    mem_limit: "${NOMINATIM_MEMORY_LIMIT:-3g}"
    cpus: "${NOMINATIM_CPU_LIMIT:-2.00}"
    pids_limit: "${NOMINATIM_PIDS_LIMIT:-1024}"

    stop_grace_period: 2m
    logging: *common-logging

    # Do not apply no-new-privileges to this image. Its startup/import process
    # creates users and starts its bundled PostgreSQL service.

    networks:
      - aos_net

  photon:
    image: ${PHOTON_IMAGE:?PHOTON_IMAGE is required}
    container_name: aos-photon
    restart: unless-stopped

    # Photon runtime serves an already prepared photon_data directory.
    # Keep the service private and access it only through AOS backend APIs.
    ports:
      - "${PHOTON_BIND_ADDRESS:-127.0.0.1}:${PHOTON_PORT:-2322}:2322"

    environment:
      PHOTON_DATA_DIR: /photon/photon_data
      PHOTON_LISTEN_IP: 0.0.0.0
      PHOTON_PORT: 2322

    volumes:
      - photon_data:/photon/photon_data:rw

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:2322/api?q=Nairobi&limit=1",
        ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 2m

    mem_limit: "${PHOTON_MEMORY_LIMIT:-3g}"
    cpus: "${PHOTON_CPU_LIMIT:-2.00}"
    pids_limit: "${PHOTON_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  valhalla:
    image: ${VALHALLA_IMAGE:?VALHALLA_IMAGE must be pinned to an immutable digest}
    container_name: aos-valhalla
    restart: unless-stopped

    environment:
      # Runtime serves already-built routing artifacts.
      tile_urls: ""
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"

      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_transit: "False"
      build_tar: "True"

      serve_tiles: "True"
      server_threads: ${VALHALLA_THREADS:-2}
      tileset_name: ${VALHALLA_TILESET_NAME:-kenya_valhalla_tiles}

      update_existing_config: "True"
      use_default_speeds_config: "True"

    ports:
      - "${VALHALLA_BIND_ADDRESS:-127.0.0.1}:${VALHALLA_PORT:-8002}:8002"

    volumes:
      - ./maps/valhalla:/custom_files:rw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 5m

    mem_limit: "${VALHALLA_MEMORY_LIMIT:-2g}"
    cpus: "${VALHALLA_CPU_LIMIT:-2.00}"
    pids_limit: "${VALHALLA_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

volumes:
  qdrant_data:
    external: true
    name: aos_qdrant_data

  minio_data:
    external: true
    name: aos_minio_data

  nominatim_data:
    external: true
    name: aos_nominatim_data

  photon_data:
    external: true
    name: aos_photon_data

  video_redis_data:
    external: true
    name: aos_video_redis_data

networks:
  aos_net:
    external: true
    name: aos_net
