  livekit:
    # Exact multi-arch release pin for v1.13.7.
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    restart: unless-stopped

    # LiveKit reads the complete production config from LIVEKIT_CONFIG. This
    # avoids committing secrets while keeping one runtime configuration source.
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?LIVEKIT_KEYS is required}
      LIVEKIT_CONFIG: |
        port: 7880
        prometheus_port: 6789
        logging:
          level: info
          json: true
          sample: true
        redis:
          address: ${LIVEKIT_REDIS_ADDRESS:-livekit-redis:6379}
          db: ${LIVEKIT_REDIS_DB:-0}
          username: "${LIVEKIT_REDIS_USERNAME:-}"
          password: "${LIVEKIT_REDIS_PASSWORD:-}"
          tls:
            enabled: ${LIVEKIT_REDIS_TLS_ENABLED:-false}
            insecure: ${LIVEKIT_REDIS_TLS_INSECURE:-false}
            server_name: "${LIVEKIT_REDIS_TLS_SERVER_NAME:-}"
        rtc:
          tcp_port: 7881
          # LiveKit udp_port is one UDP mux socket. Multi-node production
          # scales by adding nodes (normally with host networking), not by
          # passing a range into this scalar setting.
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          allow_tcp_fallback: true
        room:
          auto_create: false
          empty_timeout: ${LIVEKIT_ROOM_EMPTY_TIMEOUT_SECONDS:-300}
          departure_timeout: ${LIVEKIT_ROOM_DEPARTURE_TIMEOUT_SECONDS:-20}
          max_participants: ${LIVEKIT_ROOM_MAX_PARTICIPANTS:-2000}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:?LIVEKIT_WEBHOOK_URL is required}
        turn:
          # Baseline embedded TURN is UDP-only. TURN/TLS is intentionally not
          # declared here because enabling it without a real TURN hostname and
          # certificate makes LiveKit fail closed at startup. Deploy TURN/TLS
          # separately with a real certificate/L4 listener when required.
          enabled: ${LIVEKIT_TURN_ENABLED:-true}
          udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
          ttl_seconds: 300
          per_user_relay_allocation_limit: ${LIVEKIT_TURN_PER_USER_ALLOCATION_LIMIT:-12}
        node_selector:
          kind: sysload
          sort_by: sysload
          algorithm: twochoice
          sysload_limit: ${LIVEKIT_NODE_SYSLOAD_LIMIT:-0.75}
        limit:
          max_metadata_size: 4096
          max_attributes_size: 4096
          max_room_name_length: 128
          max_participant_identity_length: 128
          signal_message_size_limit: 1048576
          agent_signal_message_size_limit: 1048576
          max_api_request_body_size: 1048576

    ports:
      # Signaling is private and proxied by Nginx.
      - "${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_PORT:-7880}:7880"

      # ICE/TCP fallback and UDP mux are accessed directly by clients.
      - "${LIVEKIT_TCP_BIND_ADDRESS:-0.0.0.0}:${LIVEKIT_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_UDP_BIND_ADDRESS:-0.0.0.0}:${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"

      # Embedded TURN/UDP fallback. TURN/TLS requires a real hostname and
      # certificate and is intentionally not enabled by the single-host baseline.
      - "${LIVEKIT_TURN_UDP_BIND_ADDRESS:-0.0.0.0}:${LIVEKIT_TURN_UDP_PORT:-3478}:${LIVEKIT_TURN_UDP_PORT:-3478}/udp"

      # Prometheus is host-local; scrape or proxy it from the observability stack.
      - "${LIVEKIT_METRICS_BIND_ADDRESS:-127.0.0.1}:${LIVEKIT_METRICS_PORT:-6789}:6789"

    depends_on:
      livekit-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7880"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    mem_limit: "${LIVEKIT_MEMORY_LIMIT:-1536m}"
    cpus: "${LIVEKIT_CPU_LIMIT:-2.00}"
    pids_limit: "${LIVEKIT_PIDS_LIMIT:-1024}"

    stop_grace_period: ${LIVEKIT_STOP_GRACE_PERIOD:-300s}
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  translation:
    build:
      context: ./infra/translation
      dockerfile: Dockerfile

    container_name: aos-translation
    restart: unless-stopped

    environment:
      TRANSLATION_MODEL_PATH: /models/nllb
      TRANSLATION_MODEL_NAME: ${TRANSLATION_MODEL_NAME:-nllb-200-distilled-1.3B-ct2-int8}
      TRANSLATION_DEVICE: ${TRANSLATION_DEVICE:-cpu}
      TRANSLATION_COMPUTE_TYPE: ${TRANSLATION_COMPUTE_TYPE:-int8}
      TRANSLATION_DEFAULT_SOURCE_LANGUAGE: ${TRANSLATION_DEFAULT_SOURCE_LANGUAGE:-eng_Latn}
      TRANSLATION_MAX_CHARS: ${TRANSLATION_MAX_CHARS:-1000}
      TRANSLATION_MAX_SOURCE_TOKENS: ${TRANSLATION_MAX_SOURCE_TOKENS:-768}
      TRANSLATION_MAX_DECODING_LENGTH: ${TRANSLATION_MAX_DECODING_LENGTH:-384}
      TRANSLATION_BEAM_SIZE: ${TRANSLATION_BEAM_SIZE:-4}
      TRANSLATION_MAX_CONCURRENT_REQUESTS: ${TRANSLATION_MAX_CONCURRENT_REQUESTS:-4}
      TRANSLATION_INTER_THREADS: ${TRANSLATION_INTER_THREADS:-2}
      TRANSLATION_INTRA_THREADS: ${TRANSLATION_INTRA_THREADS:-0}
      TRANSLATION_INTERNAL_TOKEN: ${TRANSLATION_INTERNAL_TOKEN:-}

    ports:
      - "${TRANSLATION_BIND_ADDRESS:-127.0.0.1}:${TRANSLATION_PORT:-8100}:8000"

    volumes:
      - "${TRANSLATION_MODEL_HOST_PATH:-./models/nllb-200-distilled-1.3B-ct2-int8}:/models/nllb:ro"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    mem_limit: "${TRANSLATION_MEMORY_LIMIT:-4g}"
    cpus: "${TRANSLATION_CPU_LIMIT:-3.00}"
    pids_limit: "${TRANSLATION_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  image-search:
    build:
      context: ./infra/image-search
      dockerfile: Dockerfile

    container_name: aos-image-search
    restart: unless-stopped

    environment:
      IMAGE_SEARCH_SERVICE_NAME: ${IMAGE_SEARCH_SERVICE_NAME:-aos-image-search}
      IMAGE_SEARCH_ENVIRONMENT: ${IMAGE_SEARCH_ENVIRONMENT:-development}
      IMAGE_SEARCH_DEBUG: ${IMAGE_SEARCH_DEBUG:-false}
      IMAGE_SEARCH_MODEL_NAME: ${IMAGE_SEARCH_MODEL_NAME:-ViT-B-32}
      IMAGE_SEARCH_PRETRAINED: ${IMAGE_SEARCH_PRETRAINED:-laion2b_s34b_b79k}
      IMAGE_SEARCH_DEVICE: ${IMAGE_SEARCH_DEVICE:-cpu}
      IMAGE_SEARCH_VECTOR_SIZE: ${IMAGE_SEARCH_VECTOR_SIZE:-512}
      IMAGE_SEARCH_QDRANT_URL: ${IMAGE_SEARCH_QDRANT_URL:-http://qdrant:6333}
      IMAGE_SEARCH_QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      IMAGE_SEARCH_COLLECTION: ${IMAGE_SEARCH_COLLECTION:-aos_ad_images_v2}
      IMAGE_SEARCH_EMBEDDING_VERSION: ${IMAGE_SEARCH_EMBEDDING_VERSION:-ViT-B-32:laion2b_s34b_b79k:v1}
      IMAGE_SEARCH_COLLECTION_SCHEMA_VERSION: ${IMAGE_SEARCH_COLLECTION_SCHEMA_VERSION:-2}
      IMAGE_SEARCH_LIMIT: ${IMAGE_SEARCH_LIMIT:-50}
      IMAGE_SEARCH_MAX_LIMIT: ${IMAGE_SEARCH_MAX_LIMIT:-100}
      IMAGE_SEARCH_SCORE_THRESHOLD: ${IMAGE_SEARCH_SCORE_THRESHOLD:-0.75}
      IMAGE_SEARCH_PRIMARY_BOOST: ${IMAGE_SEARCH_PRIMARY_BOOST:-0.02}
      IMAGE_SEARCH_MAX_IMAGE_BYTES: ${IMAGE_SEARCH_MAX_IMAGE_BYTES:-10485760}
      IMAGE_SEARCH_REQUEST_TIMEOUT_SECONDS: ${IMAGE_SEARCH_REQUEST_TIMEOUT_SECONDS:-15}
      IMAGE_SEARCH_INTERNAL_SECRET: ${SHORT_CLASSIFICATION_SECRET:?SHORT_CLASSIFICATION_SECRET is required}
      IMAGE_SEARCH_SHORT_CLASSIFICATION_MAX_FRAMES: ${IMAGE_SEARCH_SHORT_CLASSIFICATION_MAX_FRAMES:-6}
      IMAGE_SEARCH_SHORT_CLASSIFICATION_MAX_FRAME_BYTES: ${IMAGE_SEARCH_SHORT_CLASSIFICATION_MAX_FRAME_BYTES:-1048576}
      IMAGE_SEARCH_SHORT_CLASSIFICATION_MAX_TOTAL_BYTES: ${IMAGE_SEARCH_SHORT_CLASSIFICATION_MAX_TOTAL_BYTES:-6291456}
      IMAGE_SEARCH_SHORT_CLASSIFICATION_TEMPERATURE: ${IMAGE_SEARCH_SHORT_CLASSIFICATION_TEMPERATURE:-0.05}
      IMAGE_SEARCH_SHORT_CLASSIFICATION_MODEL_VERSION: ${IMAGE_SEARCH_SHORT_CLASSIFICATION_MODEL_VERSION:-openclip-v1}
      IMAGE_SEARCH_FILE_BASE_URL: ${IMAGE_SEARCH_FILE_BASE_URL:-}
      IMAGE_SEARCH_ALLOWED_IMAGE_HOSTS: ${IMAGE_SEARCH_ALLOWED_IMAGE_HOSTS:-}
      AOS_MEDIA_PUBLIC_BASE_URL: ${AOS_MEDIA_PUBLIC_BASE_URL:-}
      XDG_CACHE_HOME: /models/openclip/cache
      HF_HOME: /models/openclip/huggingface
      TORCH_HOME: /models/openclip/torch

    ports:
      - "${IMAGE_SEARCH_BIND_ADDRESS:-127.0.0.1}:${IMAGE_SEARCH_PORT:-8110}:8000"

    volumes:
      - image_search_models:/models/openclip

    depends_on:
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 300s

    mem_limit: "${IMAGE_SEARCH_MEMORY_LIMIT:-4g}"
    cpus: "${IMAGE_SEARCH_CPU_LIMIT:-3.00}"
    pids_limit: "${IMAGE_SEARCH_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  background-removal:
    build:
      context: ./infra/background-removal
      dockerfile: Dockerfile

    container_name: aos-background-removal
    restart: unless-stopped

    environment:
      BACKGROUND_REMOVAL_SERVICE_SECRET: ${BACKGROUND_REMOVAL_SERVICE_SECRET:?BACKGROUND_REMOVAL_SERVICE_SECRET is required}
      BACKGROUND_REMOVAL_MAX_IMAGE_BYTES: ${BACKGROUND_REMOVAL_MAX_IMAGE_BYTES:-10485760}
      BACKGROUND_REMOVAL_MAX_IMAGE_PIXELS: ${BACKGROUND_REMOVAL_MAX_IMAGE_PIXELS:-16000000}
      BACKGROUND_REMOVAL_MAX_CONCURRENT_INFERENCES: ${BACKGROUND_REMOVAL_MAX_CONCURRENT_INFERENCES:-2}
      BACKGROUND_REMOVAL_INFERENCE_ACQUIRE_TIMEOUT_SECONDS: ${BACKGROUND_REMOVAL_INFERENCE_ACQUIRE_TIMEOUT_SECONDS:-1}
      OMP_NUM_THREADS: ${BACKGROUND_REMOVAL_CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    ports:
      - "${BACKGROUND_REMOVAL_BIND_ADDRESS:-127.0.0.1}:${BACKGROUND_REMOVAL_PORT:-8120}:8000"

    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/cache/aos/numba:size=256m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    mem_limit: "${BACKGROUND_REMOVAL_MEMORY_LIMIT:-3g}"
    cpus: "${BACKGROUND_REMOVAL_CPU_LIMIT:-2.00}"
    pids_limit: "${BACKGROUND_REMOVAL_PIDS_LIMIT:-1024}"

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  video-api:
    build:
      context: ./infra/video-processing
      dockerfile: Dockerfile

    container_name: aos-video-api
    restart: unless-stopped

    environment:
      VIDEO_SERVICE_NAME: ${VIDEO_SERVICE_NAME:-aos-video-processing}
      VIDEO_SERVICE_ENVIRONMENT: ${VIDEO_SERVICE_ENVIRONMENT:-development}
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:-}
      VIDEO_CALLBACK_URL: ${VIDEO_CALLBACK_URL:?VIDEO_CALLBACK_URL is required}
      VIDEO_SERVICE_DEBUG: ${VIDEO_SERVICE_DEBUG:-false}
      VIDEO_SERVICE_SECRET: ${VIDEO_SERVICE_SECRET:?VIDEO_SERVICE_SECRET is required}
      VIDEO_SERVICE_CALLBACK_SECRET: ${VIDEO_SERVICE_CALLBACK_SECRET:?VIDEO_SERVICE_CALLBACK_SECRET is required}
      VIDEO_REDIS_URL: ${VIDEO_REDIS_URL:-redis://video-redis:6379/0}
      VIDEO_QUEUE_NAME: ${VIDEO_QUEUE_NAME:-video}
      VIDEO_CALLBACK_QUEUE_NAME: ${VIDEO_CALLBACK_QUEUE_NAME:-video-callbacks}
      VIDEO_JOB_TIMEOUT_SECONDS: ${VIDEO_JOB_TIMEOUT_SECONDS:-7200}
      VIDEO_DURABLE_RESULT_TTL_SECONDS: ${VIDEO_DURABLE_RESULT_TTL_SECONDS:-604800}
      VIDEO_CALLBACK_JOB_TIMEOUT_SECONDS: ${VIDEO_CALLBACK_JOB_TIMEOUT_SECONDS:-120}
      VIDEO_CALLBACK_MAX_ATTEMPTS: ${VIDEO_CALLBACK_MAX_ATTEMPTS:-8}
      VIDEO_STALE_HEARTBEAT_SECONDS: ${VIDEO_STALE_HEARTBEAT_SECONDS:-180}
      VIDEO_MAX_STALE_WORK_REPLAYS: ${VIDEO_MAX_STALE_WORK_REPLAYS:-2}
      VIDEO_RESULT_TTL_SECONDS: ${VIDEO_RESULT_TTL_SECONDS:-86400}
      VIDEO_FAILURE_TTL_SECONDS: ${VIDEO_FAILURE_TTL_SECONDS:-604800}
      VIDEO_MAX_DURATION_SECONDS: ${VIDEO_MAX_DURATION_SECONDS:-600}
      VIDEO_MAX_INPUT_BYTES: ${VIDEO_MAX_INPUT_BYTES:-536870912}
