  photon:
    build:
      context: ./infra/maps/photon
      dockerfile: Dockerfile
      args:
        PHOTON_VERSION: ${PHOTON_VERSION:-1.2.0}
        PHOTON_JAR_URL: https://github.com/komoot/photon/releases/download/${PHOTON_VERSION:-1.2.0}/photon-${PHOTON_VERSION:-1.2.0}.jar
        PHOTON_JAR_SHA256: ${PHOTON_JAR_SHA256:?PHOTON_JAR_SHA256 is required}

    restart: unless-stopped

    environment:
      PHOTON_LISTEN_IP: 0.0.0.0
      PHOTON_PORT: 2322
      PHOTON_MAX_RESULTS: ${PHOTON_MAX_RESULTS:-20}
      PHOTON_MAX_REVERSE_RESULTS: ${PHOTON_MAX_REVERSE_RESULTS:-10}
      PHOTON_QUERY_TIMEOUT_SECONDS: ${PHOTON_QUERY_TIMEOUT_SECONDS:-5}
      PHOTON_DEFAULT_LANGUAGE: ${PHOTON_DEFAULT_LANGUAGE:-en}
      PHOTON_METRICS_ENABLED: "true"
      PHOTON_OPENSEARCH_TRANSPORT_ADDRESSES: ${PHOTON_OPENSEARCH_TRANSPORT_ADDRESSES:?External OpenSearch 3.x addresses are required}
      PHOTON_OPENSEARCH_CLUSTER: ${PHOTON_OPENSEARCH_CLUSTER:-photon}
      JAVA_OPTS: ${PHOTON_JAVA_OPTS:--Xms512m -Xmx2g -XX:+ExitOnOutOfMemoryError}

    ports:
      - "${PHOTON_BIND_ADDRESS:-127.0.0.1}:${PHOTON_PORT:-2322}:2322"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2322/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    mem_limit: "${PHOTON_MEMORY_LIMIT:-3g}"
    mem_reservation: "${PHOTON_MEMORY_RESERVATION:-2g}"
    cpus: "${PHOTON_CPU_LIMIT:-2.00}"
    pids_limit: "${PHOTON_PIDS_LIMIT:-1024}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    stop_grace_period: 60s
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

  valhalla:
    profiles: ["maps-routing"]
    image: ${VALHALLA_IMAGE:?VALHALLA_IMAGE must be pinned to an immutable digest}
    restart: unless-stopped

    # Runtime bypasses the scripted build entrypoint completely. The scripted
    # entrypoint mutates /custom_files even when rebuild flags are false; direct
    # valhalla_service execution keeps the verified graph release truly read-only.
    entrypoint: ["valhalla_service"]
    command: ["/custom_files/valhalla.json", "${VALHALLA_THREADS:-4}"]

    ports:
      - "${VALHALLA_BIND_ADDRESS:-127.0.0.1}:${VALHALLA_PORT:-8002}:8002"

    volumes:
      - ${VALHALLA_GRAPH_CURRENT_PATH:-./maps/valhalla/current}:/custom_files:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    mem_limit: "${VALHALLA_MEMORY_LIMIT:-8g}"
    mem_reservation: "${VALHALLA_MEMORY_RESERVATION:-4g}"
    cpus: "${VALHALLA_CPU_LIMIT:-4.00}"
    pids_limit: "${VALHALLA_PIDS_LIMIT:-2048}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    stop_grace_period: 2m
    logging: *common-logging
    <<: *common-security

    networks:
      - aos_net

