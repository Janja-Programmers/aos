    mem_limit: "${LIVEKIT_REDIS_MEMORY_LIMIT:-384m}"
    cpus: "${LIVEKIT_REDIS_CPU_LIMIT:-0.50}"
    pids_limit: "${LIVEKIT_REDIS_PIDS_LIMIT:-256}"

    stop_grace_period: 30s
    logging: *common-logging
    <<: *common-security

    networks:
