[project]
name = "aos"
authors = [
    { name = "Africa Online Stores", email = "info@africaonlinestores.com" }
]
description = "A multi-vendor marketplace platform enabling users to buy, sell, go live, and communicate via chat and in-app calls across multiple countries."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "rembg==2.0.56",
    "Pillow>=10.3.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable
    "B904", # raise inside except without from
    "E101", # mixed tabs and spaces
    "E402", # module level import not at top
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # unused imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # tabs
    "UP030", # implicit positional references
    "UP031", # percent formatting
    "UP032", # prefer f-string
    "UP037", # quoted annotations
    "UP040", # type aliases instead of annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
