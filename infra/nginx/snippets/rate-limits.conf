# Baseline public API throttling. Signed callbacks use a separate, higher-
# capacity but bounded bucket. Private diagnostics/metrics are explicitly
# exempt from the public bucket. Both keys use the direct network peer address;
# forwarded headers are ignored until operators configure trusted proxy CIDRs.
map $uri $aos_public_api_rate_key {
    default $binary_remote_addr;
    ~^/api/method/aos\.api\.v1\..*handle_callback$ "";
    ~^/api/method/aos\.api\.metrics\.(prometheus|background_jobs|backup_readiness)$ "";
    ~^/api/method/aos\.api\.v1\.diagnostics\..*$ "";
}

map $uri $aos_callback_rate_key {
    default "";
    ~^/api/method/aos\.api\.v1\..*handle_callback$ $binary_remote_addr;
}

limit_req_zone $aos_public_api_rate_key zone=aos_public_api_baseline:20m rate=10r/s;
limit_req_zone $aos_callback_rate_key zone=aos_signed_callback:20m rate=50r/s;
