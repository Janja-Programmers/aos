# Runtime directory and default ACL for Frappe Socket.IO (aos) and Nginx (www-data).
# Apply with: sudo systemd-tmpfiles --create /etc/tmpfiles.d/aos-socketio.conf
d /run/aos-socketio 2770 aos www-data -
a+ /run/aos-socketio - - - - u::rwx,g::rwx,g:www-data:rwx,m::rwx,o::---,d:u::rwx,d:g::rwx,d:g:www-data:rwx,d:m::rwx,d:o::---
