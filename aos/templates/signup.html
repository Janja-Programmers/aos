<link
	rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<form class="form-signin form-signup hide" role="form">
	<div class="page-card-body">
		<div class="form-group">
			<label class="form-label sr-only" for="signup_fullname">{{ _("Full Name") }}</label>
			<div class="email-field">
				<input
					type="text"
					id="signup_fullname"
					class="form-control"
					placeholder="{{ _('Jane Doe') }}"
					required
					autofocus
					autocomplete="name"
				/>
				<i class="fas fa-user fa-md field-icon"></i>
			</div>
		</div>

		<div class="form-group">
			<label class="form-label sr-only" for="signup_email">{{ _("Email") }}</label>
			<div class="email-field">
				<input
					type="email"
					id="signup_email"
					class="form-control"
					placeholder="{{ _('jane@example.com') }}"
					required
					autocomplete="username"
				/>
				<i class="fas fa-envelope fa-md field-icon"></i>
			</div>
		</div>

		<div class="form-group">
			<label class="form-label sr-only" for="signup_user_type">{{ _("User Type") }}</label>
			<div class="email-field" style="position: relative">
				<select
					id="signup_user_type"
					class="form-control"
					required
					style="padding-left: 35px"
				>
					<option value="" disabled selected>{{ _("Select User Type") }}</option>
					<option value="buyer">{{ _("Buyer") }}</option>
					<option value="vendor">{{ _("Vendor") }}</option>
				</select>
				<i
					class="fas fa-briefcase fa-md field-icon"
					style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%)"
				></i>
			</div>
		</div>

		<div class="form-group">
			<label class="form-label sr-only" for="signup_phone">{{ _("Phone Number") }}</label>
			<div class="email-field">
				<input
					type="tel"
					id="signup_phone"
					class="form-control"
					placeholder="{{ _('0700123456') }}"
					required
					autocomplete="tel"
				/>
				<i class="fas fa-phone fa-md field-icon"></i>
			</div>
		</div>

		<div class="form-group">
			<label class="form-label sr-only" for="signup_password">{{ _("Password") }}</label>
			<div class="password-field">
				<input
					type="password"
					id="signup_password"
					class="form-control"
					placeholder="{{ _('Password') }}"
					required
					autocomplete="new-password"
				/>
				<i class="fas fa-lock fa-md field-icon"></i>
				<span toggle="#signup_password" class="toggle-password text-muted">
					{{ _('Show') }}
				</span>
			</div>
		</div>

		<div class="form-group">
			<label class="form-label sr-only" for="signup_confirm_password">
				{{ _("Confirm Password") }}
			</label>
			<div class="password-field">
				<input
					type="password"
					id="signup_confirm_password"
					class="form-control"
					placeholder="{{ _('Confirm Password') }}"
					required
					autocomplete="new-password"
				/>
				<i class="fas fa-lock fa-md field-icon"></i>
				<span toggle="#signup_confirm_password" class="toggle-password text-muted">
					{{ _('Show') }}
				</span>
			</div>
		</div>

		<div class="form-group mt-3">
			<div class="d-flex align-items-center">
				<input type="checkbox" id="signup_agree_terms" class="form-check-input" required />
				<label class="form-check-label ms-2 mb-0 small" for="signup_agree_terms">
					{{ _("I agree to the") }}
					<a href="/tac" target="_blank">{{ _("Terms & Conditions") }}</a>
					{{ _("and") }}
					<a href="/privacy" target="_blank">{{ _("Privacy Policy") }}</a>.
				</label>
			</div>
		</div>
	</div>

	<div class="page-card-actions">
		<button class="btn btn-sm btn-primary btn-block btn-signup" type="submit">
			{{ _("Sign up") }}
		</button>

		<p class="text-center sign-up-message">
			<a href="#login" class="blue">{{ _("Have an account? Login") }}</a>
		</p>
	</div>
</form>
