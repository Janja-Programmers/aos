name: Controlled deployment
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full immutable Git SHA (dry-run validation only)
        required: true
      dry_run:
        description: Validate without changing hosts
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: aos-controlled-deployment-main
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
          fetch-depth: 1
      - name: Verify eligible trigger and current release
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$MANUAL_DRY_RUN" == "true" ]] || {
              echo "::error::Manual deployment dispatch is dry-run only."
              exit 1
            }
          else
            [[ "$SOURCE_EVENT" == "push" && "$SOURCE_BRANCH" == "main" && "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
              echo "::error::Only a successful same-repository main push CI run can initiate deployment."
              exit 1
            }
            current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            [[ "$current_main" == "$RELEASE_COMMIT" ]] || {
              echo "::error::Release is stale: CI commit is no longer main HEAD."
              exit 1
            }
          fi
      - id: release
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          git archive --format=tar.gz --output=aos-release.tar.gz "${RELEASE_COMMIT}"
          python scripts/deploy/release_manifest.py create release-manifest.json aos-release.tar.gz "${RELEASE_COMMIT}"
          echo "commit=${RELEASE_COMMIT}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.release.outputs.commit }}
          path: |
            aos-release.tar.gz
            release-manifest.json
          retention-days: 30
          if-no-files-found: error

  staging:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      DEPLOY_ENVIRONMENT: staging
      RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
      RELEASE_ARTIFACT: aos-release.tar.gz
      RELEASE_MANIFEST: release-manifest.json
      CI_GATE_VERIFIED: ${{ github.event_name == 'workflow_run' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      REMOTE_BENCH_ROOT: ${{ vars.REMOTE_BENCH_ROOT }}
      FRAPPE_SITE: ${{ vars.FRAPPE_SITE }}
      REMOTE_RELEASE_ROOT: ${{ vars.REMOTE_RELEASE_ROOT }}
      REMOTE_APPLY_RELEASE_PATH: ${{ vars.REMOTE_APPLY_RELEASE_PATH }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          name: release-${{ needs.release.outputs.commit }}
      - name: Refuse stale staging release
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -Eeuo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current_main" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Staging release is stale: commit is no longer main HEAD."
            exit 1
          }
      - name: Install known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >known_hosts && chmod 0600 known_hosts
      - name: Staging preflight
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [[ "${DRY_RUN}" == "true" ]]; then args+=(--dry-run); fi
          scripts/deploy/preflight.sh "${args[@]}"
      - name: Deploy staging
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [[ "${DRY_RUN}" == "true" ]]; then args+=(--dry-run); fi
          scripts/deploy/deploy.sh "${args[@]}"
      - name: Staging smoke checks
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [[ "${DRY_RUN}" == "true" ]]; then args+=(--dry-run); fi
          scripts/deploy/smoke.sh "${args[@]}"

  production:
    needs: [release, staging]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_ENVIRONMENT: production
      PRODUCTION_APPROVAL_CONTEXT: 'true'
      RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
      RELEASE_ARTIFACT: aos-release.tar.gz
      RELEASE_MANIFEST: release-manifest.json
      CI_GATE_VERIFIED: 'true'
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      REMOTE_BENCH_ROOT: ${{ vars.REMOTE_BENCH_ROOT }}
      FRAPPE_SITE: ${{ vars.FRAPPE_SITE }}
      REMOTE_RELEASE_ROOT: ${{ vars.REMOTE_RELEASE_ROOT }}
      REMOTE_APPLY_RELEASE_PATH: ${{ vars.REMOTE_APPLY_RELEASE_PATH }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          name: release-${{ needs.release.outputs.commit }}
      - name: Refuse stale production release
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -Eeuo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ "$current_main" == "$RELEASE_COMMIT" ]] || {
            echo "::error::Production release is stale: commit is no longer main HEAD."
            exit 1
          }
      - name: Enforce production deployment enablement
        env:
          PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.AOS_PRODUCTION_DEPLOYMENT_ENABLED }}
        run: |
          set -Eeuo pipefail
          [[ "$PRODUCTION_DEPLOYMENT_ENABLED" == "true" ]] || {
            echo "::error::Production deployment disabled. AOS_PRODUCTION_DEPLOYMENT_ENABLED must be true in the protected production Environment."
            exit 1
          }
      - env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >known_hosts && chmod 0600 known_hosts
      - name: Production preflight and migration gates
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
        run: scripts/deploy/preflight.sh
      - name: Deploy production
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
        run: scripts/deploy/deploy.sh
      - name: Production health and job checks
        env:
          DEPLOY_KNOWN_HOSTS_FILE: ${{ github.workspace }}/known_hosts
        run: scripts/deploy/smoke.sh
