default_language_version:
  python: python3.14
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: repository-structure
        name: Validate JSON, TOML, YAML, conflicts, debug statements and whitespace
        entry: python ci/validate_repository.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint checkpoint-owned Python
        entry: ruff check
        language: system
        types: [python]
        files: ^(ci/.*\.py|infra/(analytics-pipeline|background-removal|image-search|moderation|notification-delivery|search-ranking|translation|video-processing)/tests/.*\.py)$
      - id: foundation-manifests
        name: Validate version pins, hash locks and service matrices
        entry: python ci/validate_foundation.py
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: Ruff formatting check for checkpoint-owned Python
        entry: ruff format --check
        language: system
        types: [python]
        files: ^(ci/.*\.py|infra/(analytics-pipeline|background-removal|image-search|moderation|notification-delivery|search-ranking|translation|video-processing)/tests/.*\.py)$
